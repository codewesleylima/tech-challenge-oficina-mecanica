name: Branch Policy Enforcement

on:
  pull_request:
    branches: [develop, hom, main]
    types: [opened, synchronize, reopened, edited]

jobs:
  validate:
    name: Validate Branch Routing
    runs-on: ubuntu-latest

    steps:
      - name: Check branch naming and routing rules
        run: |
          SOURCE="${{ github.head_ref }}"
          TARGET="${{ github.base_ref }}"

          echo "Source branch : $SOURCE"
          echo "Target branch : $TARGET"

          # Rule 1 — PRs to develop must come from feature/* only
          if [[ "$TARGET" == "develop" ]]; then
            if [[ ! "$SOURCE" =~ ^feature/ ]]; then
              echo ""
              echo "BLOCKED: PRs to 'develop' must come from a branch starting with 'feature/'"
              echo "  Source : $SOURCE"
              echo "  Rename your branch to 'feature/<description>' and reopen the PR."
              exit 1
            fi
          fi

          # Rule 2 — PRs to hom must come from develop only
          if [[ "$TARGET" == "hom" ]]; then
            if [[ "$SOURCE" != "develop" ]]; then
              echo ""
              echo "BLOCKED: PRs to 'hom' must come from 'develop' only"
              echo "  Source : $SOURCE"
              exit 1
            fi
          fi

          # Rule 3 — PRs to main must come from hom only
          if [[ "$TARGET" == "main" ]]; then
            if [[ "$SOURCE" != "hom" ]]; then
              echo ""
              echo "BLOCKED: PRs to 'main' must come from 'hom' only"
              echo "  Source : $SOURCE"
              exit 1
            fi
          fi

          echo ""
          echo "Branch policy OK"
          echo "  $SOURCE -> $TARGET"
