name: Branch Policy Enforcement

on:
  pull_request:
    branches: [develop, hom, main]
    types: [opened, reopened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  validate:
    name: Validate Branch Routing
    runs-on: ubuntu-latest

    steps:
      - name: Enforce branch routing policy
        uses: actions/github-script@v7
        with:
          script: |
            const source = context.payload.pull_request.head.ref;
            const target = context.payload.pull_request.base.ref;
            const prNumber = context.payload.pull_request.number;

            let violation = null;

            if (target === 'develop' && !source.startsWith('feature/')) {
              violation = [
                `PRs para \`develop\` só são aceitos de branches que começam com \`feature/\`.`,
                ``,
                `**Branch de origem:** \`${source}\``,
                ``,
                `Renomeie sua branch para \`feature/<descrição>\` e abra um novo PR.`,
              ].join('\n');
            }

            if (target === 'hom' && source !== 'develop') {
              violation = [
                `PRs para \`hom\` só são aceitos vindos de \`develop\`.`,
                ``,
                `**Branch de origem:** \`${source}\``,
              ].join('\n');
            }

            if (target === 'main' && source !== 'hom') {
              violation = [
                `PRs para \`main\` só são aceitos vindos de \`hom\`.`,
                ``,
                `**Branch de origem:** \`${source}\``,
              ].join('\n');
            }

            if (violation) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: [
                  `## ❌ Política de branches violada`,
                  ``,
                  violation,
                  ``,
                  `---`,
                  `**Fluxo obrigatório:**`,
                  `\`\`\``,
                  `feature/* → develop → hom → main`,
                  `\`\`\``,
                ].join('\n'),
              });

              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                state: 'closed',
              });

              core.setFailed(`[BLOCKED] ${source} → ${target} violates branch policy.`);
            }
