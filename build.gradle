plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'info.solidsoft.pitest' version '1.15.0'
}

group = 'com.safiap'
version = '0.0.1-SNAPSHOT'
description = 'tech-challenge-oficina-mecanica'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.1.0'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    // Persistence (PostgreSQL) — added per ADR-002 implementation plan
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'org.postgresql:postgresql'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'com.h2database:h2'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}

pitest {
    junit5PluginVersion = '1.2.1'
    targetClasses = [
            'com.safiap.techchallengeoficinamecanica.modules.serviceorder.domain.*',
            'com.safiap.techchallengeoficinamecanica.modules.serviceorder.application.*',
            'com.safiap.techchallengeoficinamecanica.modules.register.domain.*'
    ]
    targetTests = ['com.safiap.techchallengeoficinamecanica.*']
    excludedTestClasses = ['com.safiap.techchallengeoficinamecanica.integration.*']
    threads = 4
    outputFormats = ['HTML', 'XML']
    timestampedReports = false
}
