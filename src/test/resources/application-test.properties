# Integration test profile — in-memory H2 (no Docker/Postgres needed)
spring.datasource.url=jdbc:h2:mem:oficina_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=YEAR
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

spring.flyway.enabled=false

# Notificações: sem SMTP nos testes — o EmailSenderPort cai no LoggingEmailSenderAdapter
notifications.email.enabled=false
notifications.email.from=nao-responda@oficina.local

# JWT secret (>= 256 bits) used by SecurityConfig during tests
JWT_SECRET=test-secret-key-with-at-least-256-bits-long-0123456789
JWT_EXPIRATION=3600
