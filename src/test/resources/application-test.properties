# Perfil de teste — sobe o contexto sem infraestrutura externa (H2 em memória) e com segredo dummy.
# Sobrescreve os defaults de application.properties quando o profile "test" está ativo.

# Segredo de assinatura JWT (>= 256 bits para HS256). Valor fake, exclusivo de teste.
JWT_SECRET=test-jwt-secret-test-jwt-secret-test-jwt-secret-0123456789

# Banco em memória (modo de compatibilidade PostgreSQL).
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# O Hibernate cria o schema a partir das entidades a cada execução.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
