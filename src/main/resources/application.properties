spring.application.name=tech-challenge-oficina-mecanica

# Database configuration (env-friendly defaults). Use .env or environment to override secrets.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/oficina_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:oficina}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:oficina_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate: default to none for now; override with SPRING_JPA_HIBERNATE_DDL_AUTO if needed
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Note: Do NOT commit real credentials. Mask secrets as ***REDACTED*** in documentation.