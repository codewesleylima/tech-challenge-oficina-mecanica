services:

  postgres:
    image: postgres:15-alpine
    container_name: oficina-db

    environment:
      POSTGRES_DB: ${DB_NAME:-oficina_db}
      POSTGRES_USER: ${DB_USER:-oficina}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-oficina_pass}

    ports:
      - "${DB_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-oficina} -d ${DB_NAME:-oficina_db}"]
      interval: 5s
      timeout: 3s
      retries: 3

    networks:
      - oficina-network

  mailhog:
    image: mailhog/mailhog:latest
    container_name: oficina-mailhog
    ports:
      - "${MAIL_PORT:-1025}:1025"
      - "${MAIL_UI_PORT:-8025}:8025"
    networks:
      - oficina-network
  sonarqube:
    image: sonarqube:latest
    container_name: sonar-qube
    ports:
      - 9000:9000
    networks:
      - oficina-network
    environment:
      - SONARQUBE_JDBC_USERNAME=${DB_USER:-oficina}
      - SONARQUBE_JDBC_PASSWORD=${DB_PASSWORD:-oficina_pass}
      - SONARQUBE_JDBC_URL=jdbc:postgresql://postgres:5432/${DB_NAME:-oficina_db}
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: oficina-backend

    ports:
      - "8080:8080"

    environment:
      SPRING_APPLICATION_NAME: oficina-sistema
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE:-dev}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-oficina_db}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-oficina}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-oficina_pass}
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      JWT_SECRET: ${JWT_SECRET:-chave-dev-minimo-256-bits-dev-dev-dev-dev-dev-dev-dev}
      JWT_EXPIRATION: 3600
      LOGGING_LEVEL_ROOT: ${LOGGING_LEVEL:-INFO}
      MAIL_HOST: ${MAIL_HOST:-mailhog}
      MAIL_PORT: 1025
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-false}
      NOTIFICATIONS_EMAIL_ENABLED: ${NOTIFICATIONS_EMAIL_ENABLED:-true}
      NOTIFICATIONS_EMAIL_FROM: ${NOTIFICATIONS_EMAIL_FROM:-nao-responda@oficina.local}

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

    depends_on:
      postgres:
        condition: service_healthy
      mailhog:
        condition: service_started

    networks:
      - oficina-network


volumes:
  postgres_data:
    driver: local
  sonarqube_data:
  sonarqube_extensions:

networks:
  oficina-network:
    driver: bridge